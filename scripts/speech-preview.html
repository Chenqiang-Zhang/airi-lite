<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日和逐句语气校验（仅本地）</title>
<style>
  body { margin: 0; background: #f5eee9; color: #41342c; font: 16px system-ui; }
  main { display: flex; min-height: 100vh; }
  #stage { width: 55vw; height: 95vh; }
  aside { flex: 1; padding: 30px 20px; }
  button { padding: 10px; margin: 5px; cursor: pointer; }
  audio { width: 100%; margin-top: 20px; }
  pre { white-space: pre-wrap; font-size: 14px; }
</style>
<main>
  <div id="stage"></div>
  <aside>
    <h1>逐句语气校验</h1>
    <p>使用真实 Kokoro 声线与 Live2D。第一句轻快，第二句温柔，第三句好奇；表情只随实际播放切换。</p>
    <button id="start">合成并播放三句话</button>
    <button id="same">同语气衔接校验</button>
    <button id="resume">播放 / 继续</button>
    <button id="pause">暂停</button>
    <button id="code">验证纯代码（不生成语音）</button>
    <button id="symbols">验证纯符号（不生成语音）</button>
    <button id="mixed">朗读含代码与链接的正文</button>
    <button id="stop">停下</button>
    <pre id="visible"></pre>
    <audio controls aria-label="语气校验播放器"></audio>
    <pre id="status">正在加载角色……</pre>
    <pre id="trace"></pre>
    <pre id="media"></pre>
    <p>只合并已经生成的同语气片段，不等待凑齐。暂停会阻止启动后续本地推理；已在途的一段可以完成。事件次数不代表播放进度或听感。</p>
    <p>This content uses sample data owned and copyrighted by Live2D Inc.<br>Hiyori Momose · Illustration: Kani Biimu</p>
  </aside>
</main>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script type="module">
  import { mountHiyori } from '../src/live2d.ts'
  import { createSpeechController } from '../src/speech.ts'
  import { loadVoice } from '../src/voice.ts'

  const output = document.querySelector('#status'), trace = document.querySelector('#trace')
  try {
    const actor = await mountHiyori(document.querySelector('#stage'))
    const audio = document.querySelector('audio')
    let playing = false, preparing = false, delivery = 'neutral', state = 'idle', problem = '', audioReady = false, loads = 0
    let sourceLoads = 0, playStarts = 0, playRequests = 0, mouth = 0, maxMouth = 0
    const history = []
    const note = text => { history.push(text); trace.textContent = history.join('\n') }
    const media = () => {
      document.querySelector('#media').textContent = `已加载音源: ${sourceLoads}\n代码 play() 调用次数: ${playRequests}\nplaying 事件次数: ${playStarts}\n音频: ${audio.currentTime.toFixed(2)} / ${Number.isFinite(audio.duration) ? audio.duration.toFixed(3) : '—'} 秒\n暂停: ${audio.paused}\n嘴形开口: ${mouth.toFixed(3)}\n最大开口: ${maxMouth.toFixed(3)}\n媒体错误: ${audio.error?.code ?? '无'}`
    }
    const originalPlay = audio.play.bind(audio)
    audio.play = () => {
      playRequests++
      note(`代码 play() 请求 ${playRequests}`)
      media()
      return originalPlay()
    }
    const sync = () => {
      actor.setActivity(playing ? 'speaking' : preparing ? 'thinking' : 'idle')
      actor.setDelivery(playing ? delivery : 'neutral')
      output.textContent = `声线状态: ${state}\n模型加载调用: ${loads}\n正在播放: ${playing}\n正在准备: ${preparing}\n有可播放音频: ${audioReady}\n当前实际语气: ${delivery}\n${problem}`
      output.dataset.loads = String(loads)
      output.dataset.playing = String(playing)
      output.dataset.preparing = String(preparing)
      output.dataset.audioReady = String(audioReady)
    }
    const controller = createSpeechController(audio, {
      onState(value) { if (value === 'loading') loads++; state = value; sync() },
      onPlaying(value) { playing = value; sync() },
      onPreparing(value) { preparing = value; sync() },
      onDelivery(value) {
        delivery = value
        note(`语气 ${value} @ ${audio.currentTime.toFixed(2)}s`)
        sync()
      },
      onMouth(opening, form) {
        actor.setMouth(opening, form)
        mouth = opening ?? 0
        maxMouth = Math.max(maxMouth, mouth)
        media()
      },
      onAudioReady(value) { audioReady = value; sync() },
      onProblem(value) { problem = value; sync() },
    })
    audio.addEventListener('loadedmetadata', () => {
      sourceLoads++
      note(`音源 ${sourceLoads}: ${audio.duration.toFixed(3)} 秒`)
      media()
    })
    audio.addEventListener('playing', () => {
      playStarts++
      note(`playing 事件 ${playStarts} @ ${audio.currentTime.toFixed(2)}s`)
      media()
    })
    for (const event of ['pause', 'ended', 'timeupdate', 'emptied'])
      audio.addEventListener(event, media)
    document.querySelector('#start').addEventListener('click', () => {
      clearTrace()
      const input = controller.beginStream('', 'bright', loadVoice())
      input.push('好耶，终于跑通啦！')
      input.setDelivery('soft')
      input.push('先歇一下，别太勉强自己。')
      input.setDelivery('curious')
      input.push('明天想从哪里开始？')
      input.finish()
    })
    const showText = text => { document.querySelector('#visible').textContent = text }
    const clearTrace = () => {
      history.length = 0; trace.textContent = ''
      sourceLoads = 0; playStarts = 0; playRequests = 0; maxMouth = 0
    }
    document.querySelector('#same').addEventListener('click', () => {
      clearTrace()
      showText('嗯，我刚才还在想，要不要换个话题。你先说，我听着呢。等我一下，马上回来。')
      const input = controller.beginStream('', 'neutral', loadVoice())
      input.push('嗯，我刚才还')
      input.setDelivery('neutral')
      input.push('在想，要不要换个话题。')
      input.push('你先说，我听着呢。')
      input.push('等我一下，马上回来。')
      input.finish()
    })
    document.querySelector('#resume').addEventListener('click', () => {
      if (audioReady) void audio.play().catch(error => { problem = error.message; sync() })
    })
    document.querySelector('#pause').addEventListener('click', () => audio.pause())
    document.querySelector('#code').addEventListener('click', () => {
      clearTrace()
      const text = '```python\n[x * 2 for x in [1, 2, 3]]\n```'
      showText(text)
      const input = controller.beginStream('', 'bright', loadVoice())
      for (const char of text) input.push(char)
      input.finish()
    })
    document.querySelector('#symbols').addEventListener('click', () => {
      clearTrace()
      const text = '😊'.repeat(89) + '1️⃣✨！！！'
      showText(text)
      void controller.speak(text)
    })
    document.querySelector('#mixed').addEventListener('click', () => {
      clearTrace()
      const text = '好耶，这段代码留在屏幕上！\n```python\nprint("这句不会被朗读。")\n```\n[先歇一下。](https://example.invalid/path_(example))\n等会儿再继续？'
      showText(text)
      const input = controller.beginStream('', 'bright', loadVoice())
      const split = text.indexOf('print') + 2, soft = text.indexOf('[先'), curious = text.indexOf('等会儿')
      for (let index = 0; index < text.length; index++) {
        if (index === split) input.setDelivery('curious')
        if (index === soft) input.setDelivery('soft')
        if (index === curious) input.setDelivery('curious')
        input.push(text[index])
      }
      input.finish()
    })
    document.querySelector('#stop').addEventListener('click', () => controller.cancel())
    addEventListener('pagehide', () => { controller.dispose(); actor.destroy() }, { once: true })
    sync()
  }
  catch (error) { output.textContent = `加载失败: ${error.message}` }
</script>
</html>
