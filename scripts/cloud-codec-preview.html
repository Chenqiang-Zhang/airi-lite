<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地云端音频解码验证</title>
<style>body{font:17px system-ui;background:#f7f3ee;color:#292832;max-width:760px;margin:60px auto;padding:24px}button{padding:12px 18px;font:inherit}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:16px}</style>
<h1>模拟音频解码验证</h1>
<p>只使用本机生成的双声道音调与假供应商响应，不是 ElevenLabs 声音、自然度或延迟测试。真实服务会被拒绝。</p>
<button id="verify">验证模拟音频解码</button>
<pre id="result" role="status">尚未请求音频。</pre>
<script type="module">
import { fetchCloudSpeech } from '../src/cloud-speech.ts'
const button = document.querySelector('#verify')
const result = document.querySelector('#result')
button.addEventListener('click', async () => {
  button.disabled = true
  try {
    if (!['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname)) throw new Error('仅允许本机模拟服务。')
    const response = await fetch('/airi/api/health', { cache: 'no-store' })
    const health = await response.json()
    if (!response.ok || health.model !== 'MOCK-NOT-DEEPSEEK' || health.speech?.provider !== 'elevenlabs')
      throw new Error('不是 ElevenLabs loopback mock，拒绝请求音频。')
    const clip = await fetchCloudSpeech({ text: '这只是本机音调测试。', delivery: 'neutral', expectedProvider: 'elevenlabs' })
    const energy = clip.samples.reduce((sum, sample) => sum + sample * sample, 0)
    result.textContent = JSON.stringify({ source: 'LOCAL-SYNTHETIC-NOT-ELEVENLABS',
      sampleRate: clip.sampleRate, samples: clip.samples.length,
      durationSeconds: clip.samples.length / clip.sampleRate,
      rms: Math.sqrt(energy / clip.samples.length), characters: clip.characters?.length ?? 0 }, null, 2)
  }
  catch (error) { result.textContent = `验证停止：${error instanceof Error ? error.message : '失败'}` }
  finally { button.disabled = false }
})
</script>
</html>
